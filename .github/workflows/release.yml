name: Release

# A tag is a release: the workflow builds every deliverable the plan names, attaches the
# checksums and creates the GitHub release. It is deliberately the only workflow that
# uploads anything, so "where did this artifact come from" has one answer.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp into the binaries (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

# One place decides what this run is: a tag names it, a manual run says the version it wants.
# Every job derives its artifact names from here, so a dispatch can never publish
# `piui_main_*` next to a release that is called something else.
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    name: server (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          # The tag is the version; a manual run says what it wants.
          # The tag is the version; the `v` prefix belongs to the tag, not to the stamp.
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          version="${VERSION#v}"
          name="pi-ui_${version}_${GOOS}_${GOARCH}"
          extension=""
          if [ "${GOOS}" = "windows" ]; then extension=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA::7}" \
            -o "../dist/${name}/pi-ui${extension}" ./cmd/pi-ui
          cp ../LICENSE "../dist/${name}/LICENSE"
          tar -C ../dist -czf "../dist/${name}.tar.gz" "${name}"
          # From inside dist, so the checksum names the file a user downloads rather than
          # the path this job happened to build in.
          (cd ../dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz*

  app:
    name: app (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux }
          - { os: ubuntu-latest, target: android }
          - { os: windows-latest, target: windows }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install the dependencies
        working-directory: app
        run: flutter pub get

      - name: Build for Linux
        if: matrix.target == 'linux'
        working-directory: app
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
          flutter build linux --release
          name="piui_${RELEASE_TAG#v}_linux_x64"
          mkdir -p "../dist/${name}"
          cp -r build/linux/x64/release/bundle/* "../dist/${name}/"
          tar -C ../dist -czf "../dist/${name}.tar.gz" "${name}"
          # From inside dist, so the checksum names the file a user downloads rather than
          # the path this job happened to build in.
          (cd ../dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          # The AppImage: one file that runs on a distribution which has no GTK or libsecret
          # of its own.
          bash packaging/linux/appimage.sh \
            build/linux/x64/release/bundle ../dist "${RELEASE_TAG#v}"

      # The APK carries the template's debug signature: a release key needs the operator's
      # keystore, and an artifact that says what it is beats one that pretends
      # (deploy/README.md).
      - name: Build for Android
        if: matrix.target == 'android'
        working-directory: app
        run: |
          flutter build apk --release
          name="piui_${RELEASE_TAG#v}_android"
          mkdir -p "../dist/${name}"
          # The template signs a release build with the debug keystore; the name says so
          # rather than calling it unsigned (it is not) or pretending it is a release key.
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/${name}/piui-debug-signed.apk"
          tar -C ../dist -czf "../dist/${name}.tar.gz" "${name}"
          # From inside dist, so the checksum names the file a user downloads rather than
          # the path this job happened to build in.
          (cd ../dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - name: Build for Windows
        if: matrix.target == 'windows'
        working-directory: app
        run: |
          flutter build windows --release
          $name = "piui_" + $env:RELEASE_TAG.TrimStart("v") + "_windows_x64"
          New-Item -ItemType Directory -Force -Path "../dist/$name" | Out-Null
          Copy-Item -Recurse "build/windows/x64/runner/Release/*" "../dist/$name/"
          Compress-Archive -Path "../dist/$name" -DestinationPath "../dist/$name.zip"
          $hash = (Get-FileHash "../dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "../dist/$name.zip.sha256"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256

  release:
    name: GitHub release
    needs: [server, app]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        # `gh` is preinstalled on the runner and authenticated by the workflow token, and
        # it writes the release body from a file so the notes are reviewable in the diff.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${RELEASE_TAG}"
          version="${tag#v}"
          notes="$(mktemp)"
          {
            echo "## pi-ui ${tag}"
            echo
            echo "Server binaries (linux amd64/arm64, windows amd64) and the client"
            echo "(Linux bundle and AppImage, Android APK signed with the template's debug key,"
            echo "Windows zip)."
            echo
            echo "Verify a download with its \`.sha256\` file: \`sha256sum -c <file>.sha256\`."
            echo
            echo "The server is a static binary: \`pi-ui serve --root <dir>\` and pair a device"
            echo "(\`pi-ui pair --url http://<host>:8787\`). See \`deploy/README.md\` for the"
            echo "network matrix and TLS."
          } > "${notes}"
          # Every artifact is flat in dist/ (download-artifact merges the folders), so the
          # glob is one level: `**` would need `shopt -s globstar` to mean anything.
          gh release create "${tag}" --title "pi-ui ${tag}" --notes-file "${notes}" dist/* \
            || gh release upload "${tag}" dist/* --clobber
