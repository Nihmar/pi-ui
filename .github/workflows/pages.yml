name: Pages

# What gets published is one directory: the landing page of `site/` at the root, and the
# browsable mockup with its rendered screenshots beside it at `/mockups/`. `site/tools/stage_site.py`
# is that copy — the same command a local `--serve` runs, so what is reviewed locally is what
# ships, and no step here writes to the repository.
#
# The landing page's "Every screen" gallery is committed markup generated from
# `mockups/index.html`; the check below fails the build when a screen was added without
# regenerating it, so a published site can never disagree with the mockup it shows.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'mockups/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deployment in flight is never cancelled: Pages keeps serving the last completed one, and
# a cancelled deploy would leave the site on the older commit until the next push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: stage and publish the site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the generated gallery is current
        run: python3 site/tools/build_gallery.py --check

      - name: Stage the site and the mockup into one directory
        run: python3 site/tools/stage_site.py --out _site

      - name: Upload the staged directory as the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy it to Pages
        id: deploy
        uses: actions/deploy-pages@v5
