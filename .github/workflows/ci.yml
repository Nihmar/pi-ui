name: CI

# The guard the repository rules require for the server and the bridge:
# formatting, vet, race tests, a static build and a generated-code drift check.
# It is intentionally small: every job runs one area's documented check list,
# and the bridge steps stay dormant until bridge/package.json lands.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only checkout is needed; nothing in this workflow writes to the repository.
permissions:
  contents: read

# A newer push on the same ref makes the running build obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Take the toolchain and the module cache key from the module itself.
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Check formatting
        # gofmt is not configurable: any listed file fails the job. Reading only
        # stdout would swallow a gofmt that fails to parse a file (a non-zero
        # exit with empty output), so its exit status is checked as well.
        run: |
          if ! unformatted=$(gofmt -l .); then
            echo "gofmt exited non-zero (could not parse a file?)" >&2
            exit 1
          fi
          if [ -n "$unformatted" ]; then
            echo "gofmt -l . reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race ./...

      - name: Build
        # Static binary: pure-Go dependencies only (no cgo).
        run: CGO_ENABLED=0 go build ./...

      - name: Check generated code drift
        # Regenerating internal/protocol/gen from schemas/ on a clean tree must
        # produce byte-identical files. `git diff` cannot do that job: it skips
        # untracked files and misses a generated file that should have been
        # deleted, so a schema added or removed without committing its generated
        # types would pass. `git status --porcelain` reports added, modified and
        # deleted paths alike, so an out-of-sync gen directory fails here.
        run: |
          bash scripts/gen.sh
          drift=$(git status --porcelain -- internal/protocol/gen)
          if [ -n "$drift" ]; then
            echo "generated code drift in internal/protocol/gen:"
            echo "$drift"
            exit 1
          fi

  bridge:
    name: bridge (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        # Guarded: bridge/ package.json is the switch that activates this job's
        # checks, so CI is green before the bridge lands and strict afterwards.
        if: ${{ hashFiles('bridge/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Install dependencies
        # npm ci requires the committed lockfile, so it stays reproducible.
        if: ${{ hashFiles('bridge/package.json') != '' }}
        run: npm ci

      - name: Type check
        if: ${{ hashFiles('bridge/package.json') != '' }}
        run: npm run typecheck

  app:
    name: app (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        # The repository pins the toolchain of AGENTS.md: a version bump is a
        # deliberate commit, not whatever stable happens to be that day.
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install the dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build for Linux
        # The desktop target needs GTK, ninja and libsecret (the keystore the
        # device token lives in), none of which the runner image carries: the
        # build is what proves the Linux deliverable still links.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
          flutter build linux --release

      - name: Build for Android
        # minSdk 35 and the manifest's permissions are what this checks: the
        # Flutter action already carries the Android SDK and a JDK.
        run: flutter build apk --debug

  app-windows:
    name: app (Windows build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install the dependencies
        run: flutter pub get

      - name: Build for Windows
        # No Windows host is available locally, so CI is where this target is
        # compiled; the debug build is enough to catch a platform break.
        run: flutter build windows --debug
