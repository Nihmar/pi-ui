name: piui_mockups
description: >-
  The clickable pi-ui mockup: the full Flutter UI with MockPiApi and fake data,
  frozen before product work and then the base of app/.
publish_to: none
version: 0.0.1+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  # One markdown stack for the whole project (ADR 0009).
  piui_markdown:
    path: ../packages/piui-markdown

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
